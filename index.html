<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Informe as Notas</h1>
        <form id="formNotas">
            <label for="nota1">Primeira nota:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Digite a primeira nota" required>
            <label for="nota2">Segunda nota:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="Digite a segunda nota" required>
            <label for="nota3">Terceira nota:</label>
            <input type="number" id="nota3" min="0" max="10" step="0.1" placeholder="Digite a terceira nota" required>
            <button type="submit">Calcular Média</button>
        </form>
        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
